<h2 class="titulo-carrito">Carrito de Compras</h2>
<section class="carrito-container">
  
  <table class="tabla-carrito">
    <thead>
      <tr>
        <th>Juego</th>
        <th>Nombre</th>
        <th>Desarrollador</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th></th>
      </tr>
    </thead>

    <tbody>
      @for (item of items; track item.id) {
        <tr>
          <td>
            <img [src]="item.img" [alt]="item.nombre" class="img-juego" />
          </td>
          <td class="nombre-juego">{{item.nombre}}</td>
          <td class="desarrollador">{{item.desarrolladora}}</td>
          <td>
            <div class="cantidad-container">
              <button class="btn-cantidad" (click)="disminuir(item.id)">-</button>
              <span class="cantidad">{{item.cantidad}}</span>
              <button class="btn-cantidad" (click)="aumentar(item.id)">+</button>
            </div>
          </td>
          <td class="precio">${{subtotal(item)}}</td>
          <td>
            <button class="btn eliminar" (click)="eliminar(item.id)">eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="botones">
    <button class="btn eliminar" (click)="vaciarCarrito()">Vaciar Carrito</button>
    <button class="btn comprar" (click)="comprar()">Comprar</button>
  </div>
</section>
