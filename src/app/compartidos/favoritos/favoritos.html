<h2 class="titulo-carrito">Lista de Deseados</h2>
<section class="carrito-container">
    <table class="tabla-carrito">
      <thead>
        <tr>
          <th>Juego</th>
          <th>Nombre</th>
          <th>Desarrollador</th>
          <th>Precio</th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of favoritos; track item.id) {
          <tr>
            <td>
              <img [src]="item.img" [alt]="item.nombre" class="img-juego" />
            </td>
            <td class="nombre-juego">{{item.nombre}}</td>
            <td class="desarrollador">{{item.desarrolladora}}</td>
            <td class="precio">${{item.precio}}</td>
            <td>
              <button class="btn eliminar" (click)="eliminar(item.id)">eliminar</button>
            </td>
            <td>
              <button class="btn agregar" (click)="agregarAlCarrito(item)">Agregar al carrito</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
</section>
