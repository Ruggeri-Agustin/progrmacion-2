<img src="https://img.itch.zone/aW1nLzM2OTk2OTcuZ2lm/original/tl9uJA.gif" alt="" class="logo"> 
<h2>Productos disponibles</h2>
<div class="container">
  <div class="row">
    @for (t of torture; track t.id) {
      @if (t.disponibilidad) {
        <div class="col-lg-3 col-md-6 col-sm-12 col-xs-12 mb-4">
          <div class="card">
            <img src="{{ t.img }}" class="card-img-top" alt="..." />
            <div class="card-body">
              <h5 class="card-title texto">{{ t.nombre }}</h5>
              <p class="card-text texto"></p>
              <a class="precio texto">$ {{ t.precio }}</a>
              <br />
              <!-- Button trigger modal -->
              <button
                type="button"
                class="btn info"
                data-bs-toggle="modal"
                [attr.data-bs-target]="'#modal' + t.id"
              >
                Info.
              </button>
              <!-- Modal -->
              <div
                class="modal fade"
                [id]="'modal' + t.id"
                data-bs-backdrop="static"
                data-bs-keyboard="false"
                tabindex="-1"
                [attr.aria-labelledby]="'staticBackdropLabel' + t.id"
                aria-hidden="true"
              >
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header d-block">
                      <div class="d-flex justify-content-between align-items-center">
                        <h1 class="modal-title fs-5" [id]="'staticBackdropLabel' + t.id">
                          {{ t.nombre }}
                        </h1>
                        <button
                          type="button"
                          class="btn-close"
                          data-bs-dismiss="modal"
                          aria-label="Close"
                        ></button>
                      </div>
                      <p class="mt-2">
                        Desarrollado por:
                        <a href="{{ t.link }}">{{ t.desarrolladora }}</a>
                      </p>
                    </div>
                    <div class="modal-body">
                      <div class="modal-body">
                        <div [id]="'carousel' + t.id" class="carousel slide">
                          <div class="carousel-inner">
                            <div class="carousel-item active">
                              <img
                                src="{{ t.cr1 }}"
                                class="d-block w-100"
                                alt="..."
                                height="254px"
                              />
                            </div>
                            <div class="carousel-item">
                              <img
                                src="{{ t.cr2 }}"
                                class="d-block w-100"
                                alt="..."
                                height="254px"
                              />
                            </div>
                            <div class="carousel-item">
                              <img
                                src="{{ t.cr3 }}"
                                class="d-block w-100"
                                alt="..."
                                height="254px"
                              />
                            </div>
                            <div class="carousel-item">
                              <img
                                src="{{ t.cr4 }}"
                                class="d-block w-100"
                                alt="..."
                                height="254px"
                              />
                            </div>
                          </div>
                          <button
                            class="carousel-control-prev"
                            type="button"
                            [attr.data-bs-target]="'#carousel' + t.id"
                            data-bs-slide="prev"
                          >
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                          </button>
                          <button
                            class="carousel-control-next"
                            type="button"
                            [attr.data-bs-target]="'#carousel' + t.id"
                            data-bs-slide="next"
                          >
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                          </button>
                        </div>
                      </div>
                    </div>
                    <div class="modal-footer">
                      <p>{{ t.desc }}</p>
                      <button type="button" class="btn agregar" (click)="agregarAlCarrito(t)">Agregar al Carrito</button>
                      <button type="button" class="btn favorito">Agregar a tu lista de deseados</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    }
  </div>
</div>
